name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (preinstalowany) - licencje i pakiety
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - run: npm install --no-audit --no-fund

      - name: Dodaj platformę Android
        run: npx cap add android

      - name: Ikona aplikacji
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#050a08' --iconBackgroundColorDark '#050a08'

      - name: Uprawnienia w manifeście (Bluetooth, telefon)
        run: python3 tools/patch-manifest.py

      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rapid-obd-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
